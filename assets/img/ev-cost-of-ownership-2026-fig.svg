<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 386" width="1000" height="386" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><title id="t">Energy cost per mile (US cents)</title><desc id="d">Bar chart of energy cost per mile: home-charged EV 4.9 cents, gas car 10.7 cents, EV on public fast charging 11.4 to 17.1 cents.</desc><rect width="1000" height="386" rx="18" fill="#12141C"/><rect x="0" y="0" width="1000" height="6" rx="3" fill="#00E5FF"/><text x="32" y="52" font-size="26" font-weight="800" fill="#F3F6FB">Energy cost per mile (US cents)</text><text x="32" y="137" font-size="19" fill="#F3F6FB">EV, home charging</text><rect x="290" y="116" width="560" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="290" y="116" width="149" height="30" rx="8" fill="#00E5FF"/><text x="451" y="138" font-size="19" font-weight="700" fill="#F3F6FB">4.9¢</text><text x="32" y="191" font-size="19" fill="#F3F6FB">Gas car, 30 mpg</text><rect x="290" y="170" width="560" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="290" y="170" width="324" height="30" rx="8" fill="#FFB020"/><text x="626" y="192" font-size="19" font-weight="700" fill="#F3F6FB">10.7¢</text><text x="32" y="245" font-size="19" fill="#F3F6FB">EV, public DC at $0.40/kWh</text><rect x="290" y="224" width="560" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="290" y="224" width="346" height="30" rx="8" fill="#7C5CFF"/><text x="648" y="246" font-size="19" font-weight="700" fill="#F3F6FB">11.4¢</text><text x="32" y="299" font-size="19" fill="#F3F6FB">EV, public DC at $0.60/kWh</text><rect x="290" y="278" width="560" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="290" y="278" width="519" height="30" rx="8" fill="#7C5CFF"/><text x="821" y="300" font-size="19" font-weight="700" fill="#F3F6FB">17.1¢</text><text x="32" y="366" font-size="14" fill="#8B93A7">Assumes $0.17/kWh, 3.5 mi/kWh, gasoline $3.20/gal, 30 mpg. Illustrative, not a forecast.</text></svg>