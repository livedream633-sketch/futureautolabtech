<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 332" width="1000" height="332" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><title id="t">Typical home charger power by amperage (kW)</title><desc id="d">Bar chart pairing 32, 40 and 48 amp home chargers with their breakers and power: 7.7, 9.6 and 11.5 kilowatts.</desc><rect width="1000" height="332" rx="18" fill="#12141C"/><rect x="0" y="0" width="1000" height="6" rx="3" fill="#00E5FF"/><text x="32" y="52" font-size="26" font-weight="800" fill="#F3F6FB">Typical home charger power by amperage (kW)</text><text x="32" y="137" font-size="19" fill="#F3F6FB">32 A charger · 40 A breaker</text><rect x="290" y="116" width="560" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="290" y="116" width="347" height="30" rx="8" fill="#00E5FF"/><text x="649" y="138" font-size="19" font-weight="700" fill="#F3F6FB">7.7 kW</text><text x="32" y="191" font-size="19" fill="#F3F6FB">40 A charger · 50 A breaker</text><rect x="290" y="170" width="560" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="290" y="170" width="433" height="30" rx="8" fill="#00E5FF"/><text x="735" y="192" font-size="19" font-weight="700" fill="#F3F6FB">9.6 kW</text><text x="32" y="245" font-size="19" fill="#F3F6FB">48 A charger · 60 A breaker</text><rect x="290" y="224" width="560" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="290" y="224" width="519" height="30" rx="8" fill="#00E5FF"/><text x="821" y="246" font-size="19" font-weight="700" fill="#F3F6FB">11.5 kW</text><text x="32" y="312" font-size="14" fill="#8B93A7">Pairings from this article. Confirm with a licensed electrician; many cars accept only 7–11 kW AC.</text></svg>