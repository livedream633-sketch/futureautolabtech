<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><title id="t">Typical charging power (kW)</title><desc id="d">Range bars: Level 1 delivers 1.2 to 1.4 kilowatts, Level 2 delivers 6 to 11 kilowatts.</desc><rect width="1000" height="290" rx="18" fill="#12141C"/><rect x="0" y="0" width="1000" height="6" rx="3" fill="#00E5FF"/><text x="32" y="52" font-size="26" font-weight="800" fill="#F3F6FB">Typical charging power (kW)</text><text x="32" y="137" font-size="19" fill="#F3F6FB">Level 1 (120 V)</text><rect x="290" y="116" width="540" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="344" y="116" width="9" height="30" rx="8" fill="#00E5FF"/><text x="364" y="138" font-size="19" font-weight="700" fill="#F3F6FB">1.2–1.4 kW</text><text x="32" y="197" font-size="19" fill="#F3F6FB">Level 2 (240 V)</text><rect x="290" y="176" width="540" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="558" y="176" width="223" height="30" rx="8" fill="#7C5CFF"/><text x="793" y="198" font-size="19" font-weight="700" fill="#F3F6FB">6–11 kW</text><text x="32" y="270" font-size="14" fill="#8B93A7">From this article. A 40-mile day at 0.30 kWh/mile is about 12 kWh: roughly 9 hours on Level 1, 1–2 hours on Level 2 (before losses).</text></svg>