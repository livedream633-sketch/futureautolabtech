<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 332" width="1000" height="332" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><title id="t">Illustrative range of a 300-mile EV as the battery ages (miles)</title><desc id="d">Bar chart: 300 miles new, 285 miles after roughly 5 percent loss, 270 miles after roughly 10 percent loss.</desc><rect width="1000" height="332" rx="18" fill="#12141C"/><rect x="0" y="0" width="1000" height="6" rx="3" fill="#00E5FF"/><text x="32" y="52" font-size="26" font-weight="800" fill="#F3F6FB">Illustrative range of a 300-mile EV as the battery ages (miles)</text><text x="32" y="137" font-size="19" fill="#F3F6FB">New</text><rect x="290" y="116" width="560" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="290" y="116" width="519" height="30" rx="8" fill="#00E5FF"/><text x="821" y="138" font-size="19" font-weight="700" fill="#F3F6FB">300 mi</text><text x="32" y="191" font-size="19" fill="#F3F6FB">~5% capacity lost</text><rect x="290" y="170" width="560" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="290" y="170" width="493" height="30" rx="8" fill="#7C5CFF"/><text x="795" y="192" font-size="19" font-weight="700" fill="#F3F6FB">285 mi</text><text x="32" y="245" font-size="19" fill="#F3F6FB">~10% capacity lost (about 5 years, typical)</text><rect x="290" y="224" width="560" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="290" y="224" width="467" height="30" rx="8" fill="#FFB020"/><text x="769" y="246" font-size="19" font-weight="700" fill="#F3F6FB">270 mi</text><text x="32" y="312" font-size="14" fill="#8B93A7">Illustration using figures in this article; results differ by car, climate and charging habits.</text></svg>