<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><title id="t">Plan legs inside the middle of the battery</title><desc id="d">Range bars showing a 10 to 80 percent battery window and a comfortable leg of 150 to 200 miles for a 300-mile car.</desc><rect width="1000" height="290" rx="18" fill="#12141C"/><rect x="0" y="0" width="1000" height="6" rx="3" fill="#00E5FF"/><text x="32" y="52" font-size="26" font-weight="800" fill="#F3F6FB">Plan legs inside the middle of the battery</text><text x="32" y="137" font-size="19" fill="#F3F6FB">Battery window</text><rect x="290" y="116" width="540" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="315" y="116" width="172" height="30" rx="8" fill="#00E5FF"/><text x="498" y="138" font-size="19" font-weight="700" fill="#F3F6FB">10%–80%</text><text x="32" y="197" font-size="19" fill="#F3F6FB">Rated range 300 mi → comfortable leg</text><rect x="290" y="176" width="540" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="658" y="176" width="123" height="30" rx="8" fill="#7C5CFF"/><text x="793" y="198" font-size="19" font-weight="700" fill="#F3F6FB">150–200 mi</text><text x="32" y="270" font-size="14" fill="#8B93A7">Rules of thumb from this article. Your car may charge faster or slower above 80%.</text></svg>