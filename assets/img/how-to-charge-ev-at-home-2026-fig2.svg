<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 356" width="1000" height="356" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><title id="t">Hours to add 40 kWh at home</title><desc id="d">Bar chart of hours needed to add 40 kilowatt-hours: Level 1 at 1.4 kW about 28.6 hours, 7.7 kW about 5.2 hours, 9.6 kW about 4.2 hours, 11.5 kW about 3.5 hours.</desc><rect width="1000" height="356" rx="18" fill="#12141C"/><rect x="0" y="0" width="1000" height="6" rx="3" fill="#00E5FF"/><text x="32" y="52" font-size="26" font-weight="800" fill="#F3F6FB">Hours to add 40 kWh at home</text><text x="32" y="106" font-size="18" fill="#F3F6FB">Level 1, 1.4 kW</text><rect x="330" y="84" width="520" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="330" y="84" width="495" height="30" rx="8" fill="#FFB020"/><text x="813" y="106" font-size="18" font-weight="700" fill="#0B0D12" text-anchor="end">28.6 h</text><text x="32" y="160" font-size="18" fill="#F3F6FB">Level 2, 7.7 kW (32 A)</text><rect x="330" y="138" width="520" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="330" y="138" width="90" height="30" rx="8" fill="#00E5FF"/><text x="432" y="160" font-size="18" font-weight="700" fill="#F3F6FB">5.2 h</text><text x="32" y="214" font-size="18" fill="#F3F6FB">Level 2, 9.6 kW (40 A)</text><rect x="330" y="192" width="520" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="330" y="192" width="72" height="30" rx="8" fill="#00E5FF"/><text x="414" y="214" font-size="18" font-weight="700" fill="#F3F6FB">4.2 h</text><text x="32" y="268" font-size="18" fill="#F3F6FB">Level 2, 11.5 kW (48 A)</text><rect x="330" y="246" width="520" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="330" y="246" width="60" height="30" rx="8" fill="#00E5FF"/><text x="402" y="268" font-size="18" font-weight="700" fill="#F3F6FB">3.5 h</text><text x="32" y="340" font-size="15" fill="#9AA3B8">Energy ÷ power. Real sessions run slightly longer because of charging losses and tapering near full.</text></svg>