<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 356" width="1000" height="356" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><title id="t">Hours of charging needed per day</title><desc id="d">Bar chart of hours needed: Level 1 for 12 kWh about 9.6 hours, Level 2 for 12 kWh about 1.8 hours, Level 1 for 24 kWh about 19.2 hours, which exceeds a 12 hour overnight window.</desc><rect width="1000" height="356" rx="18" fill="#12141C"/><rect x="0" y="0" width="1000" height="6" rx="3" fill="#00E5FF"/><text x="32" y="52" font-size="26" font-weight="800" fill="#F3F6FB">Hours of charging needed per day</text><text x="32" y="106" font-size="18" fill="#F3F6FB">Level 1, 12 kWh (40 mi)</text><rect x="330" y="84" width="520" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="330" y="84" width="249" height="30" rx="8" fill="#FFB020"/><text x="591" y="106" font-size="18" font-weight="700" fill="#F3F6FB">9.6 h</text><text x="32" y="160" font-size="18" fill="#F3F6FB">Level 2, 12 kWh (40 mi)</text><rect x="330" y="138" width="520" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="330" y="138" width="46" height="30" rx="8" fill="#00E5FF"/><text x="388" y="160" font-size="18" font-weight="700" fill="#F3F6FB">1.8 h</text><text x="32" y="214" font-size="18" fill="#F3F6FB">Level 1, 24 kWh (80 mi)</text><rect x="330" y="192" width="520" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="330" y="192" width="499" height="30" rx="8" fill="#FF5C7A"/><text x="817" y="214" font-size="18" font-weight="700" fill="#0B0D12" text-anchor="end">19.2 h</text><text x="32" y="268" font-size="18" fill="#F3F6FB">Level 2, 24 kWh (80 mi)</text><rect x="330" y="246" width="520" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="330" y="246" width="96" height="30" rx="8" fill="#00E5FF"/><text x="438" y="268" font-size="18" font-weight="700" fill="#F3F6FB">3.7 h</text><line x1="642" y1="70" x2="642" y2="290" stroke="#FFB020" stroke-width="2" stroke-dasharray="6 5"/><text x="642" y="66" font-size="15" fill="#FFB020" text-anchor="middle">12 h overnight</text><text x="32" y="340" font-size="15" fill="#9AA3B8">Illustrative: Level 1 delivers about 1.25 kW to the battery, Level 2 about 6.5 kW, at 0.30 kWh per mile.</text></svg>