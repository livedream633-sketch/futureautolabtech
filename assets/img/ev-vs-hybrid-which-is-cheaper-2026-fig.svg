<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 332" width="1000" height="332" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><title id="t">Yearly energy cost at 12,000 miles ($)</title><desc id="d">Bar chart of yearly energy cost: gas car $1,280, hybrid $768, EV charged at home $583.</desc><rect width="1000" height="332" rx="18" fill="#12141C"/><rect x="0" y="0" width="1000" height="6" rx="3" fill="#00E5FF"/><text x="32" y="52" font-size="26" font-weight="800" fill="#F3F6FB">Yearly energy cost at 12,000 miles ($)</text><text x="32" y="137" font-size="19" fill="#F3F6FB">Gas car, 30 mpg</text><rect x="290" y="116" width="560" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="290" y="116" width="519" height="30" rx="8" fill="#FFB020"/><text x="821" y="138" font-size="19" font-weight="700" fill="#F3F6FB">$1,280</text><text x="32" y="191" font-size="19" fill="#F3F6FB">Hybrid, 50 mpg</text><rect x="290" y="170" width="560" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="290" y="170" width="311" height="30" rx="8" fill="#7C5CFF"/><text x="613" y="192" font-size="19" font-weight="700" fill="#F3F6FB">$768</text><text x="32" y="245" font-size="19" fill="#F3F6FB">EV, home charging</text><rect x="290" y="224" width="560" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="290" y="224" width="236" height="30" rx="8" fill="#00E5FF"/><text x="538" y="246" font-size="19" font-weight="700" fill="#F3F6FB">$583</text><text x="32" y="312" font-size="14" fill="#8B93A7">Assumes gasoline $3.20/gal and electricity $0.17/kWh with 3.5 mi/kWh. Illustrative.</text></svg>