<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 386" width="1000" height="386" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><title id="t">Range of a 75 kWh usable battery at different efficiencies (miles)</title><desc id="d">Bar chart: a 75 kWh battery gives 300 miles at 4.0 mi/kWh, 262 at 3.5, 225 at 3.0 and about 188 at 2.5 mi/kWh.</desc><rect width="1000" height="386" rx="18" fill="#12141C"/><rect x="0" y="0" width="1000" height="6" rx="3" fill="#00E5FF"/><text x="32" y="52" font-size="26" font-weight="800" fill="#F3F6FB">Range of a 75 kWh usable battery at different efficiencies (miles)</text><text x="32" y="137" font-size="19" fill="#F3F6FB">4.0 mi/kWh, gentle mild-weather driving</text><rect x="290" y="116" width="560" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="290" y="116" width="519" height="30" rx="8" fill="#00E5FF"/><text x="821" y="138" font-size="19" font-weight="700" fill="#F3F6FB">300 mi</text><text x="32" y="191" font-size="19" fill="#F3F6FB">3.5 mi/kWh, typical mixed driving</text><rect x="290" y="170" width="560" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="290" y="170" width="453" height="30" rx="8" fill="#00E5FF"/><text x="755" y="192" font-size="19" font-weight="700" fill="#F3F6FB">262 mi</text><text x="32" y="245" font-size="19" fill="#F3F6FB">3.0 mi/kWh, fast highway driving</text><rect x="290" y="224" width="560" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="290" y="224" width="389" height="30" rx="8" fill="#7C5CFF"/><text x="691" y="246" font-size="19" font-weight="700" fill="#F3F6FB">225 mi</text><text x="32" y="299" font-size="19" fill="#F3F6FB">2.5 mi/kWh, highway in freezing weather</text><rect x="290" y="278" width="560" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="290" y="278" width="325" height="30" rx="8" fill="#FFB020"/><text x="627" y="300" font-size="19" font-weight="700" fill="#F3F6FB">≈188 mi</text><text x="32" y="366" font-size="14" fill="#8B93A7">Illustrative: usable capacity × efficiency. Real range depends on speed, temperature, tires and load.</text></svg>