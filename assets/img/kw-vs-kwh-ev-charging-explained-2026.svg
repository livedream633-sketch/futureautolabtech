<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0A0F"/><stop offset="1" stop-color="#16213a"/></linearGradient></defs><rect width="1200" height="630" fill="url(#g)"/><circle cx="1010" cy="130" r="230" fill="#22d3ee" opacity=".07"/><circle cx="1100" cy="560" r="170" fill="#22d3ee" opacity=".06"/><text x="60" y="80" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">W<tspan fill="#22d3ee">att</tspan>lab</text><rect x="60" y="120" width="175" height="38" rx="19" fill="#22d3ee" opacity=".18"/><text x="80" y="146" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#22d3ee">EXPLAINED</text><text x="60" y="230" font-family="DejaVu Sans, Arial, sans-serif" font-size="46" font-weight="700" fill="#fff">kWh = the tank. kW = the flow.</text>
<g transform="translate(90,290)"><rect width="200" height="230" rx="16" fill="none" stroke="#22d3ee" stroke-width="6"/><rect x="8" y="90" width="184" height="132" rx="10" fill="#22d3ee" opacity=".35"/><text x="100" y="125" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="34" font-weight="700" fill="#fff">60 kWh</text><text x="100" y="270" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#94a3b8">Battery size (energy)</text></g>
<g transform="translate(440,330)"><rect width="300" height="60" rx="10" fill="#22d3ee" opacity=".35"/><path d="M300 -20 L360 30 L300 80 Z" fill="#22d3ee"/><text x="150" y="42" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">11 kW</text><text x="180" y="130" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#94a3b8">Charger power (rate)</text></g>
<g transform="translate(850,300)"><text x="0" y="0" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" fill="#94a3b8">Time ≈ energy ÷ power</text><text x="0" y="60" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#fff">36 kWh ÷ 11 kW</text><text x="0" y="110" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#22d3ee">≈ 3.3 hours</text><text x="0" y="160" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" fill="#94a3b8">(20% to 80% of 60 kWh)</text></g></svg>