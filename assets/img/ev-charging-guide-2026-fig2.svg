<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><title id="t">Typical public charging price per kWh</title><desc id="d">Table of typical prices per kilowatt-hour: home about 16 to 17 cents, Tesla Supercharger 32 to 45 cents, Electrify America 38 to 48 cents.</desc><rect width="1000" height="350" rx="18" fill="#12141C"/><rect x="0" y="0" width="1000" height="6" rx="3" fill="#00E5FF"/><text x="32" y="52" font-size="26" font-weight="800" fill="#F3F6FB">Typical public charging price per kWh</text><text x="32" y="92" font-size="17" font-weight="700" fill="#00E5FF">Where you charge</text><text x="400" y="92" font-size="17" font-weight="700" fill="#00E5FF">Typical price per kWh</text><text x="720" y="92" font-size="17" font-weight="700" fill="#00E5FF">Cost to add 30 kWh</text><line x1="32" y1="104" x2="968" y2="104" stroke="#232838" stroke-width="2"/><rect x="20" y="110" width="960" height="44" rx="8" fill="#232838" opacity=".35"/><text x="32" y="138" font-size="17" font-weight="700" fill="#F3F6FB">Home (US average)</text><text x="400" y="138" font-size="17" font-weight="400" fill="#F3F6FB">$0.16–$0.17</text><text x="720" y="138" font-size="17" font-weight="400" fill="#F3F6FB">$4.80–$5.10</text><text x="32" y="188" font-size="17" font-weight="700" fill="#F3F6FB">Tesla Supercharger</text><text x="400" y="188" font-size="17" font-weight="400" fill="#F3F6FB">$0.32–$0.45</text><text x="720" y="188" font-size="17" font-weight="400" fill="#F3F6FB">$9.60–$13.50</text><rect x="20" y="210" width="960" height="44" rx="8" fill="#232838" opacity=".35"/><text x="32" y="238" font-size="17" font-weight="700" fill="#F3F6FB">Electrify America</text><text x="400" y="238" font-size="17" font-weight="400" fill="#F3F6FB">$0.38–$0.48</text><text x="720" y="238" font-size="17" font-weight="400" fill="#F3F6FB">$11.40–$14.40</text><text x="32" y="288" font-size="17" font-weight="700" fill="#F3F6FB">Priciest DC fast chargers</text><text x="400" y="288" font-size="17" font-weight="400" fill="#F3F6FB">$0.40–$0.55</text><text x="720" y="288" font-size="17" font-weight="400" fill="#F3F6FB">$12.00–$16.50</text><text x="32" y="334" font-size="15" fill="#9AA3B8">Prices as quoted in this article; they change by state, time of day and membership. Check the app or station.</text></svg>