<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><title id="t">The 10-point used EV checklist</title><desc id="d">Ten-item checklist for buying a used electric vehicle.</desc><rect width="1000" height="680" rx="18" fill="#12141C"/><rect x="0" y="0" width="1000" height="6" rx="3" fill="#00E5FF"/><text x="32" y="52" font-size="26" font-weight="800" fill="#F3F6FB">The 10-point used EV checklist</text><rect x="32" y="110" width="298" height="110" rx="14" fill="#0A0A0F" stroke="#232838"/><circle cx="62" cy="142" r="16" fill="#00E5FF"/><text x="62" y="148" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0A0F">1</text><text x="90" y="148" font-size="19" font-weight="700" fill="#F3F6FB">Battery health</text><text x="52" y="182" font-size="16" fill="#8B93A7">Get a report.</text><rect x="350" y="110" width="298" height="110" rx="14" fill="#0A0A0F" stroke="#232838"/><circle cx="380" cy="142" r="16" fill="#00E5FF"/><text x="380" y="148" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0A0F">2</text><text x="408" y="148" font-size="19" font-weight="700" fill="#F3F6FB">Real vs rated range</text><text x="370" y="182" font-size="16" fill="#8B93A7">Compare on a full charge.</text><rect x="668" y="110" width="298" height="110" rx="14" fill="#0A0A0F" stroke="#232838"/><circle cx="698" cy="142" r="16" fill="#00E5FF"/><text x="698" y="148" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0A0F">3</text><text x="726" y="148" font-size="19" font-weight="700" fill="#F3F6FB">Battery warranty</text><text x="688" y="182" font-size="16" fill="#8B93A7">Confirm terms and transfer.</text><rect x="32" y="240" width="298" height="110" rx="14" fill="#0A0A0F" stroke="#232838"/><circle cx="62" cy="272" r="16" fill="#00E5FF"/><text x="62" y="278" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0A0F">4</text><text x="90" y="278" font-size="19" font-weight="700" fill="#F3F6FB">Charging habits</text><text x="52" y="312" font-size="16" fill="#8B93A7">Ask how it was charged.</text><rect x="350" y="240" width="298" height="110" rx="14" fill="#0A0A0F" stroke="#232838"/><circle cx="380" cy="272" r="16" fill="#00E5FF"/><text x="380" y="278" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0A0F">5</text><text x="408" y="278" font-size="19" font-weight="700" fill="#F3F6FB">Charging gear</text><text x="370" y="312" font-size="16" fill="#8B93A7">Inspect cables and port.</text><rect x="668" y="240" width="298" height="110" rx="14" fill="#0A0A0F" stroke="#232838"/><circle cx="698" cy="272" r="16" fill="#00E5FF"/><text x="698" y="278" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0A0F">6</text><text x="726" y="278" font-size="19" font-weight="700" fill="#F3F6FB">Recalls and history</text><text x="688" y="312" font-size="16" fill="#8B93A7">Run the checks.</text><rect x="32" y="370" width="298" height="110" rx="14" fill="#0A0A0F" stroke="#232838"/><circle cx="62" cy="402" r="16" fill="#00E5FF"/><text x="62" y="408" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0A0F">7</text><text x="90" y="408" font-size="19" font-weight="700" fill="#F3F6FB">Tires and brakes</text><text x="52" y="442" font-size="16" fill="#8B93A7">Look for uneven wear.</text><rect x="350" y="370" width="298" height="110" rx="14" fill="#0A0A0F" stroke="#232838"/><circle cx="380" cy="402" r="16" fill="#00E5FF"/><text x="380" y="408" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0A0F">8</text><text x="408" y="408" font-size="19" font-weight="700" fill="#F3F6FB">Software</text><text x="370" y="442" font-size="16" fill="#8B93A7">Test connected features.</text><rect x="668" y="370" width="298" height="110" rx="14" fill="#0A0A0F" stroke="#232838"/><circle cx="698" cy="402" r="16" fill="#00E5FF"/><text x="698" y="408" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0A0F">9</text><text x="726" y="408" font-size="19" font-weight="700" fill="#F3F6FB">Test drive</text><text x="688" y="442" font-size="16" fill="#8B93A7">Drive it properly.</text><rect x="32" y="500" width="298" height="110" rx="14" fill="#0A0A0F" stroke="#232838"/><circle cx="62" cy="532" r="16" fill="#00E5FF"/><text x="62" y="538" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0A0F">10</text><text x="90" y="538" font-size="19" font-weight="700" fill="#F3F6FB">Total cost</text><text x="52" y="572" font-size="16" fill="#8B93A7">Compare with alternatives.</text><text x="32" y="660" font-size="14" fill="#8B93A7">Full explanations in the article below.</text></svg>