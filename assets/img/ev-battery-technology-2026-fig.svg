<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><title id="t">Where each battery type stands</title><desc id="d">Three cards: NMC lithium-ion and LFP are in cars today, solid-state batteries are still at prototype and pilot stage.</desc><rect width="1000" height="330" rx="18" fill="#12141C"/><rect x="0" y="0" width="1000" height="6" rx="3" fill="#00E5FF"/><text x="32" y="52" font-size="26" font-weight="800" fill="#F3F6FB">Where each battery type stands</text><rect x="32" y="110" width="298" height="150" rx="14" fill="#0A0A0F" stroke="#232838"/><circle cx="62" cy="142" r="16" fill="#00E5FF"/><text x="62" y="148" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0A0F">1</text><text x="90" y="148" font-size="19" font-weight="700" fill="#F3F6FB">NMC / NCA lithium-ion</text><text x="52" y="182" font-size="16" fill="#8B93A7">In most EVs today. High energy</text><text x="52" y="204" font-size="16" fill="#8B93A7">density.</text><rect x="350" y="110" width="298" height="150" rx="14" fill="#0A0A0F" stroke="#232838"/><circle cx="380" cy="142" r="16" fill="#00E5FF"/><text x="380" y="148" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0A0F">2</text><text x="408" y="148" font-size="19" font-weight="700" fill="#F3F6FB">LFP (iron phosphate)</text><text x="370" y="182" font-size="16" fill="#8B93A7">In many standard-range EVs.</text><text x="370" y="204" font-size="16" fill="#8B93A7">Cheaper, long-lived.</text><rect x="668" y="110" width="298" height="150" rx="14" fill="#0A0A0F" stroke="#232838"/><circle cx="698" cy="142" r="16" fill="#00E5FF"/><text x="698" y="148" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0A0F">3</text><text x="726" y="148" font-size="19" font-weight="700" fill="#F3F6FB">Solid-state</text><text x="688" y="182" font-size="16" fill="#8B93A7">Prototypes and pilots. Not yet</text><text x="688" y="204" font-size="16" fill="#8B93A7">a mainstream buy.</text><text x="32" y="310" font-size="14" fill="#8B93A7">Simplified summary of the article. Check each model for its actual chemistry.</text></svg>