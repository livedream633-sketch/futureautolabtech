<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 539" width="1000" height="539" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><title id="t">The six SAE levels of driving automation</title><desc id="d">Ladder diagram of the six SAE driving automation levels from Level 0 to Level 5.</desc><rect width="1000" height="539" rx="18" fill="#12141C"/><rect x="0" y="0" width="1000" height="6" rx="3" fill="#00E5FF"/><text x="32" y="52" font-size="26" font-weight="800" fill="#F3F6FB">The six SAE levels of driving automation</text><rect x="32" y="100" width="170" height="50" rx="10" fill="#00E5FF" opacity="0.25"/><text x="52" y="132" font-size="20" font-weight="800" fill="#F3F6FB">Level 0</text><text x="218" y="122" font-size="18" font-weight="700" fill="#F3F6FB">No automation</text><text x="218" y="142" font-size="15" fill="#8B93A7">Warnings only, e.g. emergency-braking alerts</text><rect x="32" y="164" width="265" height="50" rx="10" fill="#00E5FF" opacity="0.40"/><text x="52" y="196" font-size="20" font-weight="800" fill="#F3F6FB">Level 1</text><text x="313" y="186" font-size="18" font-weight="700" fill="#F3F6FB">Driver assistance</text><text x="313" y="206" font-size="15" fill="#8B93A7">Adaptive cruise or lane keeping, one at a time</text><rect x="32" y="228" width="360" height="50" rx="10" fill="#00E5FF" opacity="0.55"/><text x="52" y="260" font-size="20" font-weight="800" fill="#F3F6FB">Level 2</text><text x="408" y="250" font-size="18" font-weight="700" fill="#F3F6FB">Partial automation</text><text x="408" y="270" font-size="15" fill="#8B93A7">Steering and speed, driver must supervise</text><rect x="32" y="292" width="455" height="50" rx="10" fill="#00E5FF" opacity="0.70"/><text x="52" y="324" font-size="20" font-weight="800" fill="#F3F6FB">Level 3</text><text x="503" y="314" font-size="18" font-weight="700" fill="#F3F6FB">Conditional automation</text><text x="503" y="334" font-size="15" fill="#8B93A7">Car drives in set conditions, driver takes over on request</text><rect x="32" y="356" width="550" height="50" rx="10" fill="#00E5FF" opacity="0.85"/><text x="52" y="388" font-size="20" font-weight="800" fill="#F3F6FB">Level 4</text><text x="598" y="378" font-size="18" font-weight="700" fill="#F3F6FB">High automation</text><text x="598" y="398" font-size="15" fill="#8B93A7">No driver needed inside a limited service area</text><rect x="32" y="420" width="645" height="50" rx="10" fill="#00E5FF" opacity="1.00"/><text x="52" y="452" font-size="20" font-weight="800" fill="#F3F6FB">Level 5</text><text x="693" y="442" font-size="18" font-weight="700" fill="#F3F6FB">Full automation</text><text x="693" y="462" font-size="15" fill="#8B93A7">Any road, any weather. No production car yet</text><text x="32" y="519" font-size="14" fill="#8B93A7">Based on the SAE J3016 taxonomy as summarised in this article.</text></svg>