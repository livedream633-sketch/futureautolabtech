<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><title id="t">Regenerative braking in four steps</title><desc id="d">Four-step flow showing lift off, motor acting as generator, energy returning to the battery, and friction brakes assisting.</desc><rect width="1000" height="500" rx="18" fill="#12141C"/><rect x="0" y="0" width="1000" height="6" rx="3" fill="#00E5FF"/><text x="32" y="52" font-size="26" font-weight="800" fill="#F3F6FB">Regenerative braking in four steps</text><rect x="32" y="110" width="298" height="150" rx="14" fill="#0A0A0F" stroke="#232838"/><circle cx="62" cy="142" r="16" fill="#00E5FF"/><text x="62" y="148" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0A0F">1</text><text x="90" y="148" font-size="19" font-weight="700" fill="#F3F6FB">Lift off</text><text x="52" y="182" font-size="16" fill="#8B93A7">You release the accelerator or</text><text x="52" y="204" font-size="16" fill="#8B93A7">press the brake pedal.</text><rect x="350" y="110" width="298" height="150" rx="14" fill="#0A0A0F" stroke="#232838"/><circle cx="380" cy="142" r="16" fill="#00E5FF"/><text x="380" y="148" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0A0F">2</text><text x="408" y="148" font-size="19" font-weight="700" fill="#F3F6FB">Motor becomes a generator</text><text x="370" y="182" font-size="16" fill="#8B93A7">The wheels turn the motor,</text><text x="370" y="204" font-size="16" fill="#8B93A7">which produces current.</text><rect x="668" y="110" width="298" height="150" rx="14" fill="#0A0A0F" stroke="#232838"/><circle cx="698" cy="142" r="16" fill="#00E5FF"/><text x="698" y="148" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0A0F">3</text><text x="726" y="148" font-size="19" font-weight="700" fill="#F3F6FB">Energy returns to the battery</text><text x="688" y="182" font-size="16" fill="#8B93A7">A portion of the motion energy</text><text x="688" y="204" font-size="16" fill="#8B93A7">is stored as electricity.</text><rect x="32" y="280" width="298" height="150" rx="14" fill="#0A0A0F" stroke="#232838"/><circle cx="62" cy="312" r="16" fill="#00E5FF"/><text x="62" y="318" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0A0F">4</text><text x="90" y="318" font-size="19" font-weight="700" fill="#F3F6FB">Friction brakes assist</text><text x="52" y="352" font-size="16" fill="#8B93A7">For hard or low-speed stops,</text><text x="52" y="374" font-size="16" fill="#8B93A7">the pads take over smoothly.</text><text x="32" y="480" font-size="14" fill="#8B93A7">Simplified. Recovery varies with speed, battery charge and temperature.</text></svg>