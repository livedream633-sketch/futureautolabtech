<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 302" width="1000" height="302" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><title id="t">Charging 20% to 80% of a 60 kWh battery</title><desc id="d">Bar chart of time to add 36 kilowatt-hours: 7 kW takes about 5 hours 9 minutes, 11 kW about 3 hours 16 minutes, 150 kW about 14 minutes.</desc><rect width="1000" height="302" rx="18" fill="#12141C"/><rect x="0" y="0" width="1000" height="6" rx="3" fill="#00E5FF"/><text x="32" y="52" font-size="26" font-weight="800" fill="#F3F6FB">Charging 20% to 80% of a 60 kWh battery</text><text x="32" y="106" font-size="18" fill="#F3F6FB">7 kW home charger</text><rect x="330" y="84" width="520" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="330" y="84" width="502" height="30" rx="8" fill="#FFB020"/><text x="820" y="106" font-size="18" font-weight="700" fill="#0B0D12" text-anchor="end">5 h 9 min</text><text x="32" y="160" font-size="18" fill="#F3F6FB">11 kW home charger</text><rect x="330" y="138" width="520" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="330" y="138" width="318" height="30" rx="8" fill="#00E5FF"/><text x="660" y="160" font-size="18" font-weight="700" fill="#F3F6FB">3 h 16 min</text><text x="32" y="214" font-size="18" fill="#F3F6FB">150 kW DC fast (ideal)</text><rect x="330" y="192" width="520" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="330" y="192" width="23" height="30" rx="8" fill="#7C5CFF"/><text x="365" y="214" font-size="18" font-weight="700" fill="#F3F6FB">14 min</text><text x="32" y="286" font-size="15" fill="#9AA3B8">Ideal times at constant power. Real sessions are slower: charging curves taper and losses apply.</text></svg>