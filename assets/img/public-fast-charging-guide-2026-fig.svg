<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><title id="t">Energy cost per mile (US cents)</title><desc id="d">Bar chart of cost per mile: home charging 4.9 cents, fast charging at $0.30 8.6 cents, gas 10.7 cents, fast charging at $0.45 12.9 cents and at $0.60 17.1 cents.</desc><rect width="1000" height="440" rx="18" fill="#12141C"/><rect x="0" y="0" width="1000" height="6" rx="3" fill="#00E5FF"/><text x="32" y="52" font-size="26" font-weight="800" fill="#F3F6FB">Energy cost per mile (US cents)</text><text x="32" y="137" font-size="19" fill="#F3F6FB">Home Level 2 at $0.17/kWh</text><rect x="290" y="116" width="560" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="290" y="116" width="149" height="30" rx="8" fill="#00E5FF"/><text x="451" y="138" font-size="19" font-weight="700" fill="#F3F6FB">4.9¢</text><text x="32" y="191" font-size="19" fill="#F3F6FB">Fast charging at $0.30/kWh</text><rect x="290" y="170" width="560" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="290" y="170" width="261" height="30" rx="8" fill="#7C5CFF"/><text x="563" y="192" font-size="19" font-weight="700" fill="#F3F6FB">8.6¢</text><text x="32" y="245" font-size="19" fill="#F3F6FB">Gas car, 30 mpg at $3.20/gal</text><rect x="290" y="224" width="560" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="290" y="224" width="324" height="30" rx="8" fill="#FFB020"/><text x="626" y="246" font-size="19" font-weight="700" fill="#F3F6FB">10.7¢</text><text x="32" y="299" font-size="19" fill="#F3F6FB">Fast charging at $0.45/kWh</text><rect x="290" y="278" width="560" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="290" y="278" width="391" height="30" rx="8" fill="#7C5CFF"/><text x="693" y="300" font-size="19" font-weight="700" fill="#F3F6FB">12.9¢</text><text x="32" y="353" font-size="19" fill="#F3F6FB">Fast charging at $0.60/kWh</text><rect x="290" y="332" width="560" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="290" y="332" width="519" height="30" rx="8" fill="#7C5CFF"/><text x="821" y="354" font-size="19" font-weight="700" fill="#F3F6FB">17.1¢</text><text x="32" y="420" font-size="14" fill="#8B93A7">Assumes 3.5 miles per kWh. Illustrative; actual prices vary by network, place and time.</text></svg>