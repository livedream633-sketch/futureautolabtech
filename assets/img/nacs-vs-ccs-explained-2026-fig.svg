<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><title id="t">Which plug for which charger?</title><desc id="d">Three cards describing connector combinations between NACS and CCS cars and chargers.</desc><rect width="1000" height="330" rx="18" fill="#12141C"/><rect x="0" y="0" width="1000" height="6" rx="3" fill="#00E5FF"/><text x="32" y="52" font-size="26" font-weight="800" fill="#F3F6FB">Which plug for which charger?</text><rect x="32" y="110" width="298" height="150" rx="14" fill="#0A0A0F" stroke="#232838"/><circle cx="62" cy="142" r="16" fill="#00E5FF"/><text x="62" y="148" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0A0F">1</text><text x="90" y="148" font-size="19" font-weight="700" fill="#F3F6FB">NACS car → NACS charger</text><text x="52" y="182" font-size="16" fill="#8B93A7">Works directly, for example at</text><text x="52" y="204" font-size="16" fill="#8B93A7">Tesla Superchargers.</text><rect x="350" y="110" width="298" height="150" rx="14" fill="#0A0A0F" stroke="#232838"/><circle cx="380" cy="142" r="16" fill="#00E5FF"/><text x="380" y="148" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0A0F">2</text><text x="408" y="148" font-size="19" font-weight="700" fill="#F3F6FB">NACS car → CCS charger</text><text x="370" y="182" font-size="16" fill="#8B93A7">Use a certified adapter where</text><text x="370" y="204" font-size="16" fill="#8B93A7">the network allows it.</text><rect x="668" y="110" width="298" height="150" rx="14" fill="#0A0A0F" stroke="#232838"/><circle cx="698" cy="142" r="16" fill="#00E5FF"/><text x="698" y="148" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0A0F">3</text><text x="726" y="148" font-size="19" font-weight="700" fill="#F3F6FB">CCS car → NACS charger</text><text x="688" y="182" font-size="16" fill="#8B93A7">Only where the network</text><text x="688" y="204" font-size="16" fill="#8B93A7">supports your car, often with</text><text x="688" y="226" font-size="16" fill="#8B93A7">an adapter.</text><text x="32" y="310" font-size="14" fill="#8B93A7">Simplified. Always check your car maker and the charging network for current compatibility.</text></svg>