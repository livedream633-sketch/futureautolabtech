<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><title id="t">Battery chemistries at a glance</title><desc id="d">Table comparing LFP, NMC or NCA and solid-state batteries on cost, energy density, charging habits and availability.</desc><rect width="1000" height="400" rx="18" fill="#12141C"/><rect x="0" y="0" width="1000" height="6" rx="3" fill="#00E5FF"/><text x="32" y="52" font-size="26" font-weight="800" fill="#F3F6FB">Battery chemistries at a glance</text><text x="32" y="92" font-size="17" font-weight="700" fill="#00E5FF"></text><text x="270" y="92" font-size="17" font-weight="700" fill="#00E5FF">LFP</text><text x="520" y="92" font-size="17" font-weight="700" fill="#00E5FF">NMC / NCA</text><text x="760" y="92" font-size="17" font-weight="700" fill="#00E5FF">Solid-state</text><line x1="32" y1="104" x2="968" y2="104" stroke="#232838" stroke-width="2"/><rect x="20" y="110" width="960" height="44" rx="8" fill="#232838" opacity=".35"/><text x="32" y="138" font-size="17" font-weight="700" fill="#F3F6FB">Cost</text><text x="270" y="138" font-size="17" font-weight="400" fill="#F3F6FB">Generally lower</text><text x="520" y="138" font-size="17" font-weight="400" fill="#F3F6FB">Generally higher</text><text x="760" y="138" font-size="17" font-weight="400" fill="#F3F6FB">Not yet established</text><text x="32" y="188" font-size="17" font-weight="700" fill="#F3F6FB">Energy density</text><text x="270" y="188" font-size="17" font-weight="400" fill="#F3F6FB">Moderate</text><text x="520" y="188" font-size="17" font-weight="400" fill="#F3F6FB">Higher</text><text x="760" y="188" font-size="17" font-weight="400" fill="#F3F6FB">Aims higher</text><rect x="20" y="210" width="960" height="44" rx="8" fill="#232838" opacity=".35"/><text x="32" y="238" font-size="17" font-weight="700" fill="#F3F6FB">Daily 100% charge</text><text x="270" y="238" font-size="17" font-weight="400" fill="#F3F6FB">Often allowed</text><text x="520" y="238" font-size="17" font-weight="400" fill="#F3F6FB">Usually avoided</text><text x="760" y="238" font-size="17" font-weight="400" fill="#F3F6FB">Unknown</text><text x="32" y="288" font-size="17" font-weight="700" fill="#F3F6FB">Cold-weather range</text><text x="270" y="288" font-size="17" font-weight="400" fill="#F3F6FB">Can suffer more</text><text x="520" y="288" font-size="17" font-weight="400" fill="#F3F6FB">Generally better</text><text x="760" y="288" font-size="17" font-weight="400" fill="#F3F6FB">Unknown</text><rect x="20" y="310" width="960" height="44" rx="8" fill="#232838" opacity=".35"/><text x="32" y="338" font-size="17" font-weight="700" fill="#F3F6FB">In cars today</text><text x="270" y="338" font-size="17" font-weight="400" fill="#F3F6FB">Yes</text><text x="520" y="338" font-size="17" font-weight="400" fill="#F3F6FB">Yes</text><text x="760" y="338" font-size="17" font-weight="400" fill="#F3F6FB">Prototypes / pilots</text><text x="32" y="384" font-size="15" fill="#9AA3B8">General tendencies, not rules. Individual cars and cell designs vary; check the manufacturer.</text></svg>