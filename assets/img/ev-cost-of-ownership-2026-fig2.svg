<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 356" width="1000" height="356" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><title id="t">Illustrative five-year energy cost (60,000 miles)</title><desc id="d">Bar chart of five-year energy cost: home-charged EV about $2,914, gas car about $6,400, EV on public fast charging about $6,857 to $10,286.</desc><rect width="1000" height="356" rx="18" fill="#12141C"/><rect x="0" y="0" width="1000" height="6" rx="3" fill="#00E5FF"/><text x="32" y="52" font-size="26" font-weight="800" fill="#F3F6FB">Illustrative five-year energy cost (60,000 miles)</text><text x="32" y="106" font-size="18" fill="#F3F6FB">EV, home charging</text><rect x="330" y="84" width="520" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="330" y="84" width="144" height="30" rx="8" fill="#00E5FF"/><text x="486" y="106" font-size="18" font-weight="700" fill="#F3F6FB">$2,914</text><text x="32" y="160" font-size="18" fill="#F3F6FB">Gas car, 30 mpg</text><rect x="330" y="138" width="520" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="330" y="138" width="316" height="30" rx="8" fill="#FFB020"/><text x="658" y="160" font-size="18" font-weight="700" fill="#F3F6FB">$6,400</text><text x="32" y="214" font-size="18" fill="#F3F6FB">EV, public DC at $0.40/kWh</text><rect x="330" y="192" width="520" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="330" y="192" width="339" height="30" rx="8" fill="#7C5CFF"/><text x="681" y="214" font-size="18" font-weight="700" fill="#F3F6FB">$6,857</text><text x="32" y="268" font-size="18" fill="#F3F6FB">EV, public DC at $0.60/kWh</text><rect x="330" y="246" width="520" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="330" y="246" width="509" height="30" rx="8" fill="#7C5CFF"/><text x="827" y="268" font-size="18" font-weight="700" fill="#0B0D12" text-anchor="end">$10,286</text><text x="32" y="340" font-size="15" fill="#9AA3B8">Assumes $0.17/kWh home, 3.5 mi/kWh, $3.20/gal, 12,000 miles a year. Illustrative, not measured.</text></svg>