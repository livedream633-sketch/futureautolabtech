<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><title id="t">Illustrative yearly routine maintenance ($)</title><desc id="d">Grouped bar chart of illustrative yearly maintenance: gas car totals $620 and EV totals $345, with tires the only category where the EV costs more.</desc><rect width="1000" height="560" rx="18" fill="#12141C"/><rect x="0" y="0" width="1000" height="6" rx="3" fill="#00E5FF"/><text x="32" y="52" font-size="26" font-weight="800" fill="#F3F6FB">Illustrative yearly routine maintenance ($)</text><rect x="32" y="88" width="14" height="14" rx="3" fill="#00E5FF"/><text x="54" y="100" font-size="15" fill="#8B93A7">Gas car</text><rect x="200" y="88" width="14" height="14" rx="3" fill="#7C5CFF"/><text x="222" y="100" font-size="15" fill="#8B93A7">EV</text><text x="32" y="154" font-size="19" fill="#F3F6FB">Oil and filters</text><rect x="300" y="124" width="322" height="24" rx="6" fill="#00E5FF"/><text x="632" y="142" font-size="17" font-weight="700" fill="#F3F6FB">$120</text><rect x="300" y="154" width="4" height="24" rx="6" fill="#7C5CFF"/><text x="310" y="172" font-size="17" font-weight="700" fill="#F3F6FB">$0</text><text x="32" y="228" font-size="19" fill="#F3F6FB">Brakes</text><rect x="300" y="198" width="241" height="24" rx="6" fill="#00E5FF"/><text x="551" y="216" font-size="17" font-weight="700" fill="#F3F6FB">$90</text><rect x="300" y="228" width="121" height="24" rx="6" fill="#7C5CFF"/><text x="431" y="246" font-size="17" font-weight="700" fill="#F3F6FB">$45</text><text x="32" y="302" font-size="19" fill="#F3F6FB">Tires (averaged)</text><rect x="300" y="272" width="402" height="24" rx="6" fill="#00E5FF"/><text x="712" y="290" font-size="17" font-weight="700" fill="#F3F6FB">$150</text><rect x="300" y="302" width="509" height="24" rx="6" fill="#7C5CFF"/><text x="819" y="320" font-size="17" font-weight="700" fill="#F3F6FB">$190</text><text x="32" y="376" font-size="19" fill="#F3F6FB">Other scheduled items</text><rect x="300" y="346" width="509" height="24" rx="6" fill="#00E5FF"/><text x="819" y="364" font-size="17" font-weight="700" fill="#F3F6FB">$190</text><rect x="300" y="376" width="107" height="24" rx="6" fill="#7C5CFF"/><text x="417" y="394" font-size="17" font-weight="700" fill="#F3F6FB">$40</text><text x="32" y="450" font-size="19" fill="#F3F6FB">Cabin filter, wipers, fluids</text><rect x="300" y="420" width="188" height="24" rx="6" fill="#00E5FF"/><text x="498" y="438" font-size="17" font-weight="700" fill="#F3F6FB">$70</text><rect x="300" y="450" width="188" height="24" rx="6" fill="#7C5CFF"/><text x="498" y="468" font-size="17" font-weight="700" fill="#F3F6FB">$70</text><text x="32" y="540" font-size="14" fill="#8B93A7">Illustrative planning figures for about 12,000 miles a year. Totals: gas car $620, EV $345.</text></svg>