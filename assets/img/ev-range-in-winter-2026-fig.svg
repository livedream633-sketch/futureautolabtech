<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 332" width="1000" height="332" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><title id="t">A 300-mile EV in freezing weather (miles)</title><desc id="d">Bar chart: 300 miles rated, 225 miles after a 25 percent winter reduction, about 180 miles practical with a 20 percent buffer.</desc><rect width="1000" height="332" rx="18" fill="#12141C"/><rect x="0" y="0" width="1000" height="6" rx="3" fill="#00E5FF"/><text x="32" y="52" font-size="26" font-weight="800" fill="#F3F6FB">A 300-mile EV in freezing weather (miles)</text><text x="32" y="137" font-size="19" fill="#F3F6FB">Rated range, mild weather</text><rect x="290" y="116" width="560" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="290" y="116" width="519" height="30" rx="8" fill="#00E5FF"/><text x="821" y="138" font-size="19" font-weight="700" fill="#F3F6FB">300 mi</text><text x="32" y="191" font-size="19" fill="#F3F6FB">After a cautious 25% winter cut</text><rect x="290" y="170" width="560" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="290" y="170" width="389" height="30" rx="8" fill="#7C5CFF"/><text x="691" y="192" font-size="19" font-weight="700" fill="#F3F6FB">225 mi</text><text x="32" y="245" font-size="19" fill="#F3F6FB">Practical leg with a 20% buffer</text><rect x="290" y="224" width="560" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="290" y="224" width="311" height="30" rx="8" fill="#FFB020"/><text x="613" y="246" font-size="19" font-weight="700" fill="#F3F6FB">180 mi</text><text x="32" y="312" font-size="14" fill="#8B93A7">Worked example from this article. Real losses vary with speed, heating and trip length.</text></svg>