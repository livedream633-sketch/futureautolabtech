<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="1000" height="350" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><title id="t">Range added per hour of charging (miles)</title><desc id="d">Range bars: Level 1 adds 3 to 5 miles per hour, Level 2 adds 25 to 35, DC fast charging roughly 150 to 200.</desc><rect width="1000" height="350" rx="18" fill="#12141C"/><rect x="0" y="0" width="1000" height="6" rx="3" fill="#00E5FF"/><text x="32" y="52" font-size="26" font-weight="800" fill="#F3F6FB">Range added per hour of charging (miles)</text><text x="32" y="137" font-size="19" fill="#F3F6FB">Level 1 (120 V outlet)</text><rect x="290" y="116" width="540" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="297" y="116" width="8" height="30" rx="8" fill="#00E5FF"/><text x="314" y="138" font-size="19" font-weight="700" fill="#F3F6FB">3–5</text><text x="32" y="197" font-size="19" fill="#F3F6FB">Level 2 (48 A home charger)</text><rect x="290" y="176" width="540" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="351" y="176" width="25" height="30" rx="8" fill="#7C5CFF"/><text x="388" y="198" font-size="19" font-weight="700" fill="#F3F6FB">25–35</text><text x="32" y="257" font-size="19" fill="#F3F6FB">DC fast (50 kW, ~100 mi in 30–40 min)</text><rect x="290" y="236" width="540" height="30" rx="8" fill="#232838" opacity=".6"/><rect x="658" y="236" width="123" height="30" rx="8" fill="#FFB020"/><text x="793" y="258" font-size="19" font-weight="700" fill="#F3F6FB">~150–200</text><text x="32" y="330" font-size="14" fill="#8B93A7">Figures as stated in this article; the DC fast row converts ~100 miles in 30–40 minutes to a per-hour rate.</text></svg>