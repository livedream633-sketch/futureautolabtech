<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 338" width="1000" height="338" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><title id="t">Insurance vs energy: a worked example ($ per year)</title><desc id="d">Grouped bars: insurance $1,500 for a gas car versus $1,900 for an EV; energy $1,280 versus $583.</desc><rect width="1000" height="338" rx="18" fill="#12141C"/><rect x="0" y="0" width="1000" height="6" rx="3" fill="#00E5FF"/><text x="32" y="52" font-size="26" font-weight="800" fill="#F3F6FB">Insurance vs energy: a worked example ($ per year)</text><rect x="32" y="88" width="14" height="14" rx="3" fill="#00E5FF"/><text x="54" y="100" font-size="15" fill="#8B93A7">Gas car</text><rect x="200" y="88" width="14" height="14" rx="3" fill="#7C5CFF"/><text x="222" y="100" font-size="15" fill="#8B93A7">EV</text><text x="32" y="154" font-size="19" fill="#F3F6FB">Insurance premium</text><rect x="300" y="124" width="402" height="24" rx="6" fill="#00E5FF"/><text x="712" y="142" font-size="17" font-weight="700" fill="#F3F6FB">$1,500</text><rect x="300" y="154" width="509" height="24" rx="6" fill="#7C5CFF"/><text x="819" y="172" font-size="17" font-weight="700" fill="#F3F6FB">$1,900</text><text x="32" y="228" font-size="19" fill="#F3F6FB">Yearly energy cost</text><rect x="300" y="198" width="343" height="24" rx="6" fill="#00E5FF"/><text x="653" y="216" font-size="17" font-weight="700" fill="#F3F6FB">$1,280</text><rect x="300" y="228" width="156" height="24" rx="6" fill="#7C5CFF"/><text x="466" y="246" font-size="17" font-weight="700" fill="#F3F6FB">$583</text><text x="32" y="318" font-size="14" fill="#8B93A7">Example figures from this article. Your quotes and energy costs will differ.</text></svg>