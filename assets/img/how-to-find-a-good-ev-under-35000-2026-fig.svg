<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-labelledby="t d" font-family="Helvetica, Arial, 'DejaVu Sans', sans-serif"><title id="t">A simple shopping process</title><desc id="d">Six-step flow: set a budget, decide new or used, check specs, check home power, lease or buy, then test drive.</desc><rect width="1000" height="500" rx="18" fill="#12141C"/><rect x="0" y="0" width="1000" height="6" rx="3" fill="#00E5FF"/><text x="32" y="52" font-size="26" font-weight="800" fill="#F3F6FB">A simple shopping process</text><rect x="32" y="110" width="298" height="150" rx="14" fill="#0A0A0F" stroke="#232838"/><circle cx="62" cy="142" r="16" fill="#00E5FF"/><text x="62" y="148" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0A0F">1</text><text x="90" y="148" font-size="19" font-weight="700" fill="#F3F6FB">Set a real budget</text><text x="52" y="182" font-size="16" fill="#8B93A7">Include charger, insurance,</text><text x="52" y="204" font-size="16" fill="#8B93A7">tax and fees.</text><rect x="350" y="110" width="298" height="150" rx="14" fill="#0A0A0F" stroke="#232838"/><circle cx="380" cy="142" r="16" fill="#00E5FF"/><text x="380" y="148" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0A0F">2</text><text x="408" y="148" font-size="19" font-weight="700" fill="#F3F6FB">New or used?</text><text x="370" y="182" font-size="16" fill="#8B93A7">Compare total cost, not just</text><text x="370" y="204" font-size="16" fill="#8B93A7">sticker price.</text><rect x="668" y="110" width="298" height="150" rx="14" fill="#0A0A0F" stroke="#232838"/><circle cx="698" cy="142" r="16" fill="#00E5FF"/><text x="698" y="148" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0A0F">3</text><text x="726" y="148" font-size="19" font-weight="700" fill="#F3F6FB">Check the specs</text><text x="688" y="182" font-size="16" fill="#8B93A7">Range, 10–80% charge time,</text><text x="688" y="204" font-size="16" fill="#8B93A7">warranty.</text><rect x="32" y="280" width="298" height="150" rx="14" fill="#0A0A0F" stroke="#232838"/><circle cx="62" cy="312" r="16" fill="#00E5FF"/><text x="62" y="318" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0A0F">4</text><text x="90" y="318" font-size="19" font-weight="700" fill="#F3F6FB">Check your power</text><text x="52" y="352" font-size="16" fill="#8B93A7">Where and how will you charge</text><text x="52" y="374" font-size="16" fill="#8B93A7">at home?</text><rect x="350" y="280" width="298" height="150" rx="14" fill="#0A0A0F" stroke="#232838"/><circle cx="380" cy="312" r="16" fill="#00E5FF"/><text x="380" y="318" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0A0F">5</text><text x="408" y="318" font-size="19" font-weight="700" fill="#F3F6FB">Lease or buy?</text><text x="370" y="352" font-size="16" fill="#8B93A7">Depends on mileage and how</text><text x="370" y="374" font-size="16" fill="#8B93A7">long you keep it.</text><rect x="668" y="280" width="298" height="150" rx="14" fill="#0A0A0F" stroke="#232838"/><circle cx="698" cy="312" r="16" fill="#00E5FF"/><text x="698" y="318" text-anchor="middle" font-size="18" font-weight="800" fill="#0A0A0F">6</text><text x="726" y="318" font-size="19" font-weight="700" fill="#F3F6FB">Test drive</text><text x="688" y="352" font-size="16" fill="#8B93A7">Drive it on roads and at</text><text x="688" y="374" font-size="16" fill="#8B93A7">speeds you use.</text><text x="32" y="480" font-size="14" fill="#8B93A7">Condensed from the article.</text></svg>